<!DOCTYPE html>
<html>
<head>
    <title>CRUD PROJECT</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:95%;
            margin:auto;
            display:flex;
            gap:20px;
            margin-top:40px;
        }

        .left{
            width:40%;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px lightgray;
        }

        .right{
            width:60%;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px lightgray;
        }

        h1{
            margin-bottom:25px;
            font-size:32px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"]{

            width:100%;
            padding:15px;
            margin-top:20px;
            border:1px solid gray;
            border-radius:5px;
            font-size:17px;

        }

        .gender{
            margin-top:25px;
            font-size:20px;
        }

        .gender input{
            width:auto;
            margin-top:20px;
            margin-right:10px;
        }

        button{

            width:100%;
            padding:15px;
            margin-top:30px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:22px;
            cursor:pointer;

        }

        button:hover{
            background:darkgreen;
        }

        table{

            width:100%;
            border-collapse:collapse;
            margin-top:20px;

        }

        table th{

            background:black;
            color:white;
            padding:12px;
            font-size:18px;

        }

        table td{

            border:1px solid gray;
            padding:10px;
            text-align:center;
            font-size:16px;

        }

        .edit{

            background:blue;
            color:white;
            padding:8px 12px;
            border-radius:5px;
            text-decoration:none;
            font-size:15px;

        }

        .delete{

            background:red;
            color:white;
            padding:8px 12px;
            border-radius:5px;
            text-decoration:none;
            font-size:15px;

        }

    </style>

</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="left">

        <h1>Insert Student Details</h1>

        <form action="/insert/" method="POST">

            {% csrf_token %}

            <input type="text" name="name" placeholder="Enter Student Name" required>

            <input type="email" name="email" placeholder="Enter Student Email" required>

            <input type="number" name="age" placeholder="Enter Student Age" required>

            <div class="gender">

                <p>Select Gender</p>

                <input type="radio" name="gender" value="male" required> Male

                <input type="radio" name="gender" value="female"> Female

            </div>

            <button type="submit">Submit</button>

        </form>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right">

        <h1>Student Details</h1>

        <table>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Edit</th>
                <th>Delete</th>

            </tr>

            {% for i in data %}

            <tr>

                <td>{{i.id}}</td>
                <td>{{i.name}}</td>
                <td>{{i.email}}</td>
                <td>{{i.age}}</td>
                <td>{{i.gender}}</td>

                <td>
                    <a href="/edit/{{i.id}}" class="edit">
                        Edit
                    </a>
                </td>

                <td>
                    <a href="/delete/{{i.id}}" class="delete">
                        Delete
                    </a>
                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
